# =========================================================
# Application Configuration
# =========================================================

spring.application.name=community-fridge-backend
server.port=8080

# =========================================================
# MySQL Database Configuration
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/community_fridge_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate Configuration
# =========================================================

# Safe schema update for initial creation and entity changes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# MySQL Hibernate dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================================
# JWT Configuration
# =========================================================

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# =========================================================
# File Upload Configuration
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads/donations

# =========================================================
# AI FastAPI Microservice Configuration
# =========================================================
ai.service.url=http://localhost:8000

# =========================================================
# Application Configuration
# =========================================================

spring.application.name=community-fridge-backend
server.port=8080


# =========================================================
# H2 Database Configuration
# =========================================================

# File-based H2 database
spring.datasource.url=jdbc:h2:file:./data/community_fridge_db;AUTO_SERVER=TRUE

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# =========================================================
# JPA / Hibernate Configuration
# =========================================================

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# H2 Hibernate dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# =========================================================
# H2 Console
# =========================================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# =========================================================
# JWT Configuration
# =========================================================

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000


# =========================================================
# File Upload Configuration
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=uploads/donations

# =========================================================
# AI FastAPI Microservice Configuration
# =========================================================
ai.service.url=http://localhost:8000